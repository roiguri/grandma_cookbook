<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מפענח המתכונים - Recipe Genie</title>
  <meta name="description" content="Turn recipe images into digital recipes instantly with Recipe Genie">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/pwa-icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200..800&family=Heebo:wght@100..900&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Assistant', 'Heebo', sans-serif;
      background-color: #f8fafc;
    }

    .copy-toast {
      animation: slideUp 0.3s ease-out forwards;
    }

    /* Hide scrollbar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
      margin-right: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
      margin-block: 20px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #e2e8f0;
      /* slate-200 */
      border-radius: 20px;
      border: 2px solid #fff;
      /* Padding effect */
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: #cbd5e1;
      /* slate-300 */
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
